[package]
name = "notecraft-app"
description = "NoteCraft native desktop app (eframe/egui)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "notecraft-app"
path = "src/main.rs"

[dependencies]
notecraft-net = { path = "../notecraft-net" }
notecraft-core = { path = "../notecraft-core" }
notecraft-ai = { path = "../notecraft-ai" }
notecraft-meeting = { path = "../notecraft-meeting" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["image", "file", "gif", "webp", "datepicker", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff.workspace = true
rfd = "0.18"
arboard = { version = "3", default-features = false }
resvg = "0.50"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
resvg = "0.50"
icns = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
memmap2 = "0.9"
winit = { version = "0.30", default-features = false }
tray-icon = { version = "0.21", default-features = false }
objc2-foundation = { version = "0.2", features = ["NSProcessInfo", "NSString"] }

[dev-dependencies]
egui_kittest = "0.37"
tempfile.workspace = true

[package]
name = "notecraft-core"
description = "Core library of NoteCraft: workspace model, file storage, SQLite index, search, import/export (no UI)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
rusqlite.workspace = true
jiff.workspace = true
notify = "9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
krilla = "0.8.2"
ttf-parser = "0.25.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
roxmltree = "0.21.2"
base64 = "0.23.1"
md-5 = "0.11.0"

[dev-dependencies]
tempfile.workspace = true

[package]
name = "notecraft-meeting"
description = "Meeting notes for NoteCraft: microphone capture and local Whisper transcription"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Released cpal versions up to 0.18.2 deliver no audio when recording what the Mac plays; the fix is on the
# main branch only, so it is pinned by revision until the next release.
cpal = { git = "https://github.com/RustAudio/cpal", rev = "44ba7ad0c413d10de12f179091423a569a73395c" }
whisper-rs = { version = "0.15", features = ["metal"] }
# Second speech engine (NVIDIA Parakeet through ONNX Runtime). parakeet-rs 0.3.x needs ort 2.0.0-rc.13 exactly:
# Cargo.lock keeps it there (a plain `cargo update` would pick rc.15, which does not compile with it).
parakeet-rs = "0.3"
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

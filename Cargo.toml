[workspace]
resolver = "2"
members = ["crates/notecraft-core", "crates/notecraft-cli", "crates/notecraft-app", "crates/notecraft-mcp", "crates/notecraft-ai", "crates/notecraft-meeting", "crates/notecraft-net"]
default-members = ["crates/notecraft-core", "crates/notecraft-cli", "crates/notecraft-app", "crates/notecraft-mcp", "crates/notecraft-ai", "crates/notecraft-meeting", "crates/notecraft-net"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
jiff = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3

# winit 0.30.13 with one change on macOS: text sent by the emoji picker is passed on instead of dropped
# (vendor/winit/NOTECRAFT-PATCH.md)
[patch.crates-io]
winit = { path = "vendor/winit" }
